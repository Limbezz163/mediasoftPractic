version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: restaurant_reviews
    environment:
      POSTGRES_DB: mediasoft-java
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 120703ar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: